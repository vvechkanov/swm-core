name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия из тега
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Подставить версию и ссылки в module.json
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          jq --arg v "$VERSION" \
             --arg m "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg d "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.version=$v | .manifest=$m | .download=$d' module.json > module.tmp.json
          mv module.tmp.json module.json
          cat module.json

      - name: Проверить, что все файлы из module.json на месте
        run: |
          for f in $(jq -r '.esmodules[], .styles[], .languages[].path' module.json); do
            test -f "$f" || { echo "нет файла $f"; exit 1; }
          done

      - name: Собрать module.zip
        run: |
          items=""
          for p in module.json README.md LICENSE scripts styles fonts lang assets templates; do
            [ -e "$p" ] && items="$items $p"
          done
          zip -r module.zip $items -x '*.DS_Store'
          unzip -l module.zip

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true
